<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LenoBro | PC Components</title>
    <link rel="stylesheet" href="Css/Nav.css">
    <link rel="stylesheet" href="Css/index.css">
    <link rel="stylesheet" href="Css/hero.css">
    <link rel="stylesheet" href="Css/about.css">
    <link rel="stylesheet" href="Css/products.css">
    <link rel="stylesheet" href="Css/contact.css">
    <link rel="stylesheet" href="Css/footer.css">
</head>
<body>
    <nav>
        <span class="nav-brand">LenoBro</span>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="checkout.html">Checkout</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <button class="nav-cart" type="button" aria-label="Shopping cart">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 4h2l2.1 11.1a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 1.9-1.4L21 9H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="10" cy="20" r="1" fill="currentColor"/>
                <circle cx="18" cy="20" r="1" fill="currentColor"/>
            </svg>
            <span class="cart-count" aria-label="0 items">0</span>
        </button>
    </nav>

    <main>
        <section class="hero" id="home">
            <div class="hero-content">
                <p class="hero-label">LENOBRO | YOUR PC COMPONENT STORE</p>
                <h1>
                    BUILD YOUR<br>
                    DREAM <span>PC.</span>
                </h1>
                <p class="hero-description">
                    Discover quality computer components designed for performance,
                    reliability, and endless possibilities.
                </p>
                <div class="hero-buttons">
                    <a class="btn-primary" href="products.html">Explore Products</a>
                    <a class="btn-secondary" href="about.html">Learn More</a>
                </div>
            </div>

            <div class="hero-image">
                <img src="images/Logo/hero_image.jpg" alt="Gaming PC setup">
            </div>
        </section>

    </main>
    <footer class="contact-footer">
        <p>© 2026 LenoBro™. All rights reserved.</p>
        <button class="footer-members-toggle" type="button" aria-label="View group members" aria-haspopup="dialog" aria-controls="members-dialog" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/>
                <path d="M5 20v-1.5a7 7 0 0 1 14 0V20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
        </button>
    </footer>

    <script>
        (() => {
            const currency = new Intl.NumberFormat("en-PH", {
                style: "currency",
                currency: "PHP",
                maximumFractionDigits: 0
            });

            const cartIcon = document.querySelector(".nav-cart");
            const cartCount = document.querySelector(".cart-count");

            const overlay = document.createElement("div");
            overlay.className = "cart-overlay";
            const panel = document.createElement("aside");
            panel.className = "cart-panel";
            panel.setAttribute("aria-label", "Shopping cart");
            panel.innerHTML = `
                <header class="cart-header">
                    <h2>Shopping Cart</h2>
                    <button class="cart-close" type="button" aria-label="Close cart">×</button>
                </header>
                <div class="cart-items"></div>
                <footer class="cart-footer">
                    <div><span class="cart-total-label">Total</span><strong class="cart-total">₱0</strong></div>
                    <button class="cart-buy" type="button">Buy</button>
                </footer>
            `;
            document.body.append(overlay, panel);
            const checkout = document.createElement("section");
            checkout.className = "checkout-dialog";
            checkout.setAttribute("aria-label", "Order summary");
            checkout.innerHTML = `
                <h2>Order Summary</h2>
                <ul class="checkout-list"></ul>
                <strong class="checkout-total"></strong>
                <div class="checkout-actions">
                    <button class="cart-confirm-close" type="button">Close</button>
                    <button class="checkout-confirm" type="button">Confirm Purchase</button>
                </div>
            `;
            document.body.append(checkout);

            const readCart = () => {
                try {
                    return JSON.parse(localStorage.getItem("lenobro-cart") || "[]");
                } catch {
                    return [];
                }
            };

            const saveCart = cart => {
                localStorage.setItem("lenobro-cart", JSON.stringify(cart));
                renderCart();
            };

            const closeCart = () => {
                overlay.classList.remove("is-open");
                panel.classList.remove("is-open");
            };

            const renderCart = () => {
                const cart = readCart();
                const quantity = cart.reduce((sum, item) => sum + item.quantity, 0);
                const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
                cartCount.textContent = quantity;
                cartCount.setAttribute("aria-label", `${quantity} items`);
                panel.querySelector(".cart-total").textContent = currency.format(total);
                panel.querySelector(".cart-buy").disabled = cart.length === 0;

                const items = panel.querySelector(".cart-items");
                items.innerHTML = cart.length
                    ? cart.map(item => `
                        <article class="cart-item" data-key="${item.key}">
                            <img src="${item.image}" alt="">
                            <div>
                                <p class="cart-item-name">${item.name}</p>
                                <p class="cart-item-price">${currency.format(item.price)}</p>
                            </div>
                            <div class="cart-item-controls">
                                <div class="cart-quantity">
                                    <button type="button" data-action="decrease" aria-label="Decrease quantity">−</button>
                                    <span>${item.quantity}</span>
                                    <button type="button" data-action="increase" aria-label="Increase quantity">+</button>
                                </div>
                                <button class="cart-remove" type="button" data-action="remove">Remove</button>
                            </div>
                        </article>
                    `).join("")
                    : '<p class="cart-empty">Your cart is empty.</p>';
            };

            cartIcon.addEventListener("click", () => {
                overlay.classList.add("is-open");
                panel.classList.add("is-open");
                renderCart();
            });
            panel.querySelector(".cart-close").addEventListener("click", closeCart);
            overlay.addEventListener("click", closeCart);
            panel.querySelector(".cart-buy").addEventListener("click", () => {
                const cart = readCart();
                if (!cart.length) return;
                checkout.querySelector(".checkout-list").innerHTML = cart.map(item =>
                    `<li><span>${item.name} × ${item.quantity}</span><strong>${currency.format(item.price * item.quantity)}</strong></li>`
                ).join("");
                const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
                checkout.querySelector(".checkout-total").textContent = `Final total: ${currency.format(total)}`;
                checkout.classList.add("is-open");
                overlay.classList.add("is-open");
            });
            checkout.querySelector(".cart-confirm-close").addEventListener("click", () => {
                checkout.classList.remove("is-open");
                closeCart();
            });
            checkout.querySelector(".checkout-confirm").addEventListener("click", () => {
                if (!readCart().length) return;
                saveCart([]);
                checkout.classList.remove("is-open");
                closeCart();
                alert("Thank you! Your order has been confirmed.");
            });

            panel.querySelector(".cart-items").addEventListener("click", event => {
                const button = event.target.closest("[data-action]");
                const itemElement = event.target.closest(".cart-item");
                if (!button || !itemElement) return;
                const cart = readCart();
                const index = cart.findIndex(item => item.key === itemElement.dataset.key);
                if (index < 0) return;
                if (button.dataset.action === "increase") cart[index].quantity += 1;
                if (button.dataset.action === "decrease") {
                    cart[index].quantity -= 1;
                    if (cart[index].quantity < 1) cart.splice(index, 1);
                }
                if (button.dataset.action === "remove") cart.splice(index, 1);
                saveCart(cart);
            });

            renderCart();
            if (location.hash === "#cart") {
                overlay.classList.add("is-open");
                panel.classList.add("is-open");
            }
        })();
    </script>
    <script src="Js/footer.js"></script>
</body>
</html>
